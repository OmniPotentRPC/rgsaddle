name: ci

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "ci/**"
      - "verify/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # c_abi, cxx_abi, irc_abi, ocineb_abi, solid_abi, solid_bain_lj, and
      # stencil_cxx compile the C and C++ smoke programs against the cdylib
      # produced for this test build. They do not need a separate cargo build
      # or a copy of librgsaddle.so. The variable below makes a missing
      # compiler fail the job instead of skipping those tests.
      - name: Test
        env:
          RGSADDLE_REQUIRE_CAPI_SMOKE: "1"
        run: cargo test --features capi --verbose
      - name: Clippy
        run: cargo clippy --features capi -- -D warnings
      - name: Format
        run: cargo fmt --check

  ase-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and ASE 3.29.0
        run: python3 -m pip install 'numpy' 'ase==3.29.0'
      - name: Compare AutoNEB with ASE
        env:
          RGSADDLE_REQUIRE_ASE: "1"
        run: cargo test --test autoneb --verbose

  readcon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --features readcon --verbose
      - name: Clippy
        run: cargo clippy --features readcon -- -D warnings
      - name: Test with the corpus
        run: cargo test --features readcon-db --verbose
      - name: Clippy with the corpus
        run: cargo clippy --features readcon-db -- -D warnings
