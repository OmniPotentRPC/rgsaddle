name: ci

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "ci/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The C ABI smoke test links the cdylib from target/debug. cargo test
      # builds the library for the test harness only, so build it first.
      - name: Build the C ABI library
        run: cargo build --features capi --verbose
      - name: Test
        run: cargo test --features capi --verbose
      - name: Clippy
        run: cargo clippy --features capi -- -D warnings
      - name: Format
        run: cargo fmt --check

  ase-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and ASE 3.29.0
        run: python3 -m pip install 'numpy' 'ase==3.29.0'
      - name: Compare AutoNEB with ASE
        env:
          RGSADDLE_REQUIRE_ASE: "1"
        run: cargo test --test autoneb --verbose
      - name: Install the Python binding
        run: python3 -m pip install -e '.[test]' 'ase==3.29.0'
      - name: Compare IDPP with ASE
        env:
          RGSADDLE_REQUIRE_ASE: "1"
        run: python3 -m pytest -vv tests/python/test_stencil.py::test_idpp_rotation_bond_matches_ase
