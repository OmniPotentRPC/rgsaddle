name: ci

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "ci/**"
      - "verify/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The C ABI smoke test links the cdylib from target/debug. cargo test
      # builds the library for the test harness only, so build it first.
      - name: Build the C ABI library
        run: cargo build --features capi --verbose
      - name: Test
        run: cargo test --features capi --verbose
      - name: Clippy
        run: cargo clippy --features capi -- -D warnings
      - name: Format
        run: cargo fmt --check
      - name: Public items are documented
        run: cargo rustdoc --features capi -- -D missing_docs
      - name: C index and machine-local paths
        run: |
          python3 docs/check_c_symbols.py
          python3 docs/check_paths.py

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run every example
        env:
          RGSADDLE_BENCH_SYSTEM: muller-brown
          RGSADDLE_BENCH_KIND: dimer
          RGSADDLE_BENCH_METHOD: lbfgs
          RGSADDLE_BENCH_SEEDS: "1"
          RGSADDLE_BENCH_SKIP_OFF: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
          python3 -m pip install 'scikit-build-core>=1.1' 'nanobind>=3.1' 'numpy'
          cargo run --release --example double_well
          cargo run --release --example muller_brown_band -- "$RUNNER_TEMP/muller"
          cargo run --release --example minmode_trust
          cargo run --release --example band_scaling -- band 7 1 1 1 fire
          cargo run --release --example band_scaling -- minmode 7 dimer 1
          cargo run --release --example minmode_calls
          cargo run --release --example step_controls
          python3 -m pip install -e . --no-build-isolation
          python3 examples/usage.py
          python3 examples/step_controls.py

  ase-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and ASE 3.29.0
        run: python3 -m pip install 'numpy' 'ase==3.29.0'
      - name: Compare AutoNEB with ASE
        env:
          RGSADDLE_REQUIRE_ASE: "1"
        run: cargo test --test autoneb --verbose

  readcon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --features readcon --verbose
      - name: Clippy
        run: cargo clippy --features readcon -- -D warnings
      - name: Test with the corpus
        run: cargo test --features readcon-db --verbose
      - name: Clippy with the corpus
        run: cargo clippy --features readcon-db -- -D warnings

  docs-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # m4 builds GMP for the verify feature; cargo doc --all-features needs it.
      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y m4 python3-dev
          python3 -m pip install 'scikit-build-core>=1.1' 'nanobind>=3.1' 'numpy' 'ase==3.29.0'
      - name: Build the rustdoc that the name check reads
        run: |
          cargo doc --no-deps --all-features -p rgsaddle
          cargo doc --no-deps -p rgmin
      - name: Every inline name on a page exists
        run: python3 docs/check_names.py
      - name: Install the Python package
        run: python3 -m pip install . --no-build-isolation
      - name: Run every code block of the docs and the README
        run: python3 docs/run_examples.py
