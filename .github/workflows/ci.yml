name: ci

on:
  push:
    branches:
      - main
      - "perf/**"
      - "feat/**"
      - "fix/**"
      - "ci/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The C ABI smoke test links the cdylib from target/debug. cargo test
      # builds the library for the test harness only, so build it first.
      - name: Build the C ABI library
        run: cargo build --features capi --verbose
      - name: Test
        run: cargo test --features capi --verbose
      - name: Clippy
        run: cargo clippy --features capi -- -D warnings
      - name: Format
        run: cargo fmt --check

  ase-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and ASE 3.29.0
        run: python3 -m pip install 'numpy' 'ase==3.29.0'
      - name: Compare AutoNEB with ASE
        env:
          RGSADDLE_REQUIRE_ASE: "1"
        run: cargo test --test autoneb --verbose

  eigh-bits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install qemu and the aarch64 linker
        run: sudo apt-get update && sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu
      - name: Release tests without default features
        run: cargo test --release --no-default-features -- --test-threads=1
      - name: Release tests with par
        run: cargo test --release --features par -- --test-threads=1
      - name: Host SIMD paths
        run: cargo test --release --features par --test eigh_bits -- --test-threads=1 --nocapture
      - name: Nehalem, no AVX and no FMA
        run: |
          set -euo pipefail
          cargo test --release --features par --test eigh_bits --no-run --message-format=json > /tmp/eigh-bits-x86.json
          bin=$(python3 -c 'import json,sys; msgs=[json.loads(l) for l in open("/tmp/eigh-bits-x86.json") if l.strip()]; print(next(m["executable"] for m in msgs if m.get("target",{}).get("name")=="eigh_bits" and m.get("executable")))')
          qemu-x86_64 -cpu Nehalem "$bin" --test-threads=1 --nocapture
      - name: aarch64 under qemu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          cargo test --release --features par --target aarch64-unknown-linux-gnu --test eigh_bits --no-run --message-format=json > /tmp/eigh-bits-arm.json
          bin=$(python3 -c 'import json; msgs=[json.loads(l) for l in open("/tmp/eigh-bits-arm.json") if l.strip()]; print(next(m["executable"] for m in msgs if m.get("target",{}).get("name")=="eigh_bits" and m.get("executable")))')
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$bin" --test-threads=1 --nocapture

  sparse-hessian-scaling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Vacancy-cell colour scaling
        run: cargo test --release --features par --lib colour_block_strong_scaling_on_vacancy_cells -- --ignored --test-threads=1
