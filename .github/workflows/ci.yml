name: ci

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The C ABI smoke test links the cdylib from target/debug. cargo test
      # builds the library for the test harness only, so build it first.
      - name: Build the C ABI library
        run: cargo build --features capi --verbose
      - name: Test
        run: cargo test --features capi --verbose
      - name: Clippy
        run: cargo clippy --features capi -- -D warnings
      - name: Build the C ABI library (capi,ohtst)
        run: cargo build --features capi,ohtst --verbose
      - name: Test (ohtst)
        run: cargo test --features ohtst --verbose
      - name: Test (capi,ohtst)
        run: cargo test --features capi,ohtst --verbose
      - name: Clippy (capi,ohtst)
        run: cargo clippy --all-targets --features capi,ohtst -- -D warnings
      - name: Format
        run: cargo fmt --check
      - name: Public items are documented
        run: cargo rustdoc --features capi -- -D missing_docs
      - name: Public items are documented (capi,ohtst)
        run: cargo rustdoc --features capi,ohtst -- -D missing_docs
      # Every CI feature set, then private items, with every rustdoc
      # warning denied: broken, private and redundant links, bare URLs
      # and unclosed HTML.
      - name: Rustdoc builds without warnings
        run: ci/check_rustdoc.sh
      - name: C index and machine-local paths
        run: |
          python3 docs/check_c_symbols.py
          python3 docs/render_llms.py --check
          python3 docs/check_paths.py
      - name: Git dependencies pin a full rev and resolve once
        run: |
          python3 ci/check_dependency_pins.py
          cargo check --manifest-path ci/consumer/Cargo.toml --target-dir target

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run every example
        env:
          RGSADDLE_BENCH_SYSTEM: muller-brown
          RGSADDLE_BENCH_KIND: dimer
          RGSADDLE_BENCH_METHOD: lbfgs
          RGSADDLE_BENCH_SEEDS: "1"
          RGSADDLE_BENCH_SKIP_OFF: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
          python3 -m pip install 'scikit-build-core>=1.1' 'nanobind>=3.1' 'numpy'
          cargo run --release --example double_well
          cargo run --release --example muller_brown_band -- "$RUNNER_TEMP/muller"
          cargo run --release --example minmode_trust
          cargo run --release --example band_scaling -- band 7 1 1 1 fire
          cargo run --release --example band_scaling -- minmode 7 dimer 1
          cargo run --release --example minmode_calls
          cargo run --release --example step_controls
          cargo run --release --example fixed_slab_precon
          cargo run --release --example akmc_strain
          cargo run --release --features ohtst --example ohtst_skewed_well
          cargo run --release --features ohtst --example ohtst_analytic
          cargo run --release --example elastic_field_bench -- 2000
          MD_CHECK=1 cargo run --release --example langevin_nvt
          cargo run --release --example pafi_tutorial
          cargo run --release --features ohtst --example ohtst_tutorial
          cargo run --release --example rgpot_howto
          cargo run --release --features ohtst --example howto_restart
          cargo run --release --features ohtst --example howto_parallel
          cargo run --release --features ohtst --example howto_convergence
          python3 -m pip install -e . --no-build-isolation
          python3 examples/usage.py
          python3 examples/step_controls.py
          python3 examples/pafi_tutorial.py
          python3 examples/ohtst_tutorial.py

  # A meson parent project takes the headers from this checkout, as a
  # wrap-git subproject or from the installed rgsaddle-headers.pc, and
  # steps a band through the dlopened cdylib. meson.build's
  # meson_version floor is the first meson row.
  meson-consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [subproject, pkgconfig]
        meson: ["meson==0.63.0", "meson"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ${{ matrix.meson }} and ninja
        run: python3 -m pip install '${{ matrix.meson }}' ninja
      - name: Build the C ABI library
        run: cargo build --locked --features capi
      - name: Build and run the consumer (${{ matrix.mode }})
        run: ci/meson_consumer.sh ${{ matrix.mode }} target/debug/librgsaddle.so

  ase-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and ASE 3.29.0
        run: python3 -m pip install 'numpy' 'ase==3.29.0'
      - name: Compare AutoNEB with ASE
        env:
          RGSADDLE_REQUIRE_ASE: "1"
        run: cargo test --test autoneb --verbose

  readcon:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["readcon", "readcon,readcon-db"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # src/io.rs only compiles with these features, so the test job's
      # missing_docs check never sees its public items.
      - name: Build
        run: cargo build --locked --features ${{ matrix.features }} --verbose
      - name: Test
        run: cargo test --locked --features ${{ matrix.features }} --verbose
      - name: Clippy
        run: cargo clippy --locked --all-targets --features ${{ matrix.features }} -- -D warnings
      - name: Public items are documented
        run: cargo rustdoc --locked --features ${{ matrix.features }} -- -D missing_docs

  # The other jobs build on stable, and clippy's lints change between
  # releases. This job installs the rust-version from Cargo.toml and
  # repeats the clippy steps of the test and readcon jobs and of the
  # rust job in verify.yml on it, then builds and tests the C ABI with
  # the lockfile. A clippy step added there belongs here too.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tools for the bundled MPFR
        run: sudo apt-get update && sudo apt-get install -y m4 make
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "rgsaddle") | .rust_version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          components: clippy
      # Only main and develop save the cache. A pull request restores its
      # base branch's entry, which per-branch saves would evict.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Clippy (capi)
        run: cargo clippy --locked --features capi -- -D warnings
      - name: Clippy (capi,ohtst)
        run: cargo clippy --locked --all-targets --features capi,ohtst -- -D warnings
      - name: Clippy (readcon)
        run: cargo clippy --locked --all-targets --features readcon -- -D warnings
      - name: Clippy (readcon,readcon-db)
        run: cargo clippy --locked --all-targets --features readcon,readcon-db -- -D warnings
      - name: Clippy (capi,verify)
        run: cargo clippy --locked --all-targets --features capi,verify -- -D warnings
      - name: Build the C ABI library
        run: cargo build --locked --features capi
      - name: Test
        run: cargo test --locked --features capi
