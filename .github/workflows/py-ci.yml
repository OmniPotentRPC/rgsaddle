name: Python binding CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wheels:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'wheels')
    uses: OmniPotentRPC/rgpot/.github/workflows/py-wheels.yml@10a4dce7a9dc52dbbf043033ac7b9715c812e191
    with:
      package-dir: .
      import-names: rgsaddle._core
      test-path: tests/python
      extras: test

  wheel-smoke:
    name: Linux x86_64 wheel smoke
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'wheels')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test one abi3 wheel
        uses: pypa/cibuildwheel@056b871b4f3c060ea999c4bf9a7e41202d7d9f21 # v4.3.0
        with:
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: x86_64
          CIBW_BUILD: cp312-manylinux_x86_64
      - name: Audit the stable ABI
        run: |
          set -euo pipefail
          python -m pip install abi3audit
          python -m abi3audit --strict wheelhouse/*abi3*.whl

  freethreading:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-freethreading.yml@10a4dce7a9dc52dbbf043033ac7b9715c812e191
    with:
      package-dir: .
      import-names: rgsaddle._core
      test-path: tests/python
      extras: test
      iterations: "20"
      rust-crate-dir: .

  # The TSan image installs the package with --no-deps and does not read
  # `extras`, so ASE is absent and the ASE test modules skip there. The
  # ase job below runs them with RGSADDLE_REQUIRE_ASE=1.
  tsan:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-tsan.yml@10a4dce7a9dc52dbbf043033ac7b9715c812e191
    with:
      package-dir: .
      import-names: rgsaddle._core
      test-path: tests/python
      extras: test
      rust-crate-dir: .
      rust-toolchain: nightly-2026-01-20
      tsan-cmake-args: -DRGSADDLE_TSAN=ON

  ase:
    name: ASE drop-in tests (ASE 3.29.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package with the test extra
        run: python -m pip install '.[test]'
      # tests/python/ase_upstream vendors ASE 3.29.0 NEB and dimer tests and
      # substitutes rgsaddle.ase. RGSADDLE_REQUIRE_ASE=1 turns a missing ASE
      # install into a collection error, so the harness cannot skip quietly.
      - name: Pytest with ASE required
        env:
          RGSADDLE_REQUIRE_ASE: "1"
        run: |
          python -c "import ase; assert ase.__version__ == '3.29.0', ase.__version__"
          python -m pytest tests/python -ra --timeout=180 -o faulthandler_timeout=120

  typing:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-typing.yml@10a4dce7a9dc52dbbf043033ac7b9715c812e191
    with:
      package-dir: .
      import-names: rgsaddle._core
      stub-dir: python
      typecheck-paths: python/rgsaddle examples
      extras: test
      rust-crate-dir: .

  rgbind-sync:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-rgbind-sync.yml@10a4dce7a9dc52dbbf043033ac7b9715c812e191
    with:
      vendored-path: include/rgbind/rgbind.hpp
      rgpot-ref: bb82209d778dbe7fe55855abee5f783708bad893
