name: Python binding CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: py-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheels:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-wheels.yml@10a4dce7a9dc52dbbf043033ac7b9715c812e191
    with:
      package-dir: .
      import-names: rgsaddle._core
      test-path: tests/python
      extras: test

  freethreading:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-freethreading.yml@10a4dce7a9dc52dbbf043033ac7b9715c812e191
    with:
      package-dir: .
      import-names: rgsaddle._core
      test-path: tests/python
      extras: test
      iterations: "20"
      rust-crate-dir: .

  tsan:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-tsan.yml@10a4dce7a9dc52dbbf043033ac7b9715c812e191
    with:
      package-dir: .
      import-names: rgsaddle._core
      test-path: tests/python
      extras: test
      rust-crate-dir: .
      rust-toolchain: nightly-2026-01-20
      tsan-cmake-args: -DRGSADDLE_TSAN=ON

  typing:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-typing.yml@10a4dce7a9dc52dbbf043033ac7b9715c812e191
    with:
      package-dir: .
      import-names: rgsaddle._core
      stub-dir: python
      typecheck-paths: python/rgsaddle examples
      extras: test
      rust-crate-dir: .

  rgbind-sync:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-rgbind-sync.yml@10a4dce7a9dc52dbbf043033ac7b9715c812e191
    with:
      vendored-path: include/rgbind/rgbind.hpp
      rgpot-ref: 10a4dce7a9dc52dbbf043033ac7b9715c812e191
