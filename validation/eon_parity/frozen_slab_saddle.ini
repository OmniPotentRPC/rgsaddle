# eOn cc271af0d9b9c4eac6cd985a6496ec7d2c384c7e
# Adatom double well, three frozen atoms. Coordinates match
# examples/rigid_rank_bench.rs. potential = ext_pot, slab_extpot.py.
# Lanczos uses the same file with min_mode_method = lanczos.
# Box 40. The start adatom x = 0.35 stays inside the cell.
[Main]
job = saddle_search
finite_difference = 0.001
parallel = false
random_seed = 1

[Potential]
potential = ext_pot
ext_pot_path = slab_extpot.py

[Optimizer]
opt_method = fire
converged_force = 0.001
max_move = 0.05
max_iterations = 200

[Saddle Search]
min_mode_method = dimer
displace_type = load
max_iterations = 200
remove_rotation = true
converged_force = 0.001

[Dimer]
remove_rotation = true
rotations_max = 12
improved = true

[Lanczos]
tolerance = 0.001
max_iterations = 8
