# eOn cc271af0d9b9c4eac6cd985a6496ec7d2c384c7e
# Same double well. The con files add 10 to x and slab_extpot.py is run
# with SHIFT = (10, 0, 0), so the path from x = -1 stays inside the cell.
# pbc = false. images = 3 interior beads.
[Main]
job = nudged_elastic_band
finite_difference = 0.001
parallel = false
pbc = false
random_seed = 1

[Potential]
potential = ext_pot
ext_pot_path = slab_extpot.py

[Optimizer]
opt_method = fire
converged_force = 0.001
max_move = 0.05
max_iterations = 200

[Nudged Elastic Band]
images = 3
spring = 5.0
climbing_image_method = true
opt_method = fire
max_iterations = 200
