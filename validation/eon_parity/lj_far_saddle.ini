# eOn cc271af0d9b9c4eac6cd985a6496ec7d2c384c7e
# Lennard-Jones trimer at the linear saddle, bend 1e-4, shift
# (1e5, -4e4, 2.5e4). Box 1e7. displace_type=load with
# displacement.con equal to pos.con and direction.dat the middle-atom y.
# Lanczos uses the same file with min_mode_method = lanczos.
[Main]
job = saddle_search
finite_difference = 0.001
parallel = false
random_seed = 1

[Potential]
potential = lj

[Optimizer]
opt_method = fire
converged_force = 0.001
max_move = 0.05
max_iterations = 200

[Saddle Search]
min_mode_method = dimer
displace_type = load
max_iterations = 200
remove_rotation = true
converged_force = 0.001

[Dimer]
remove_rotation = true
rotations_max = 12
improved = true

[Lanczos]
tolerance = 0.001
max_iterations = 8
