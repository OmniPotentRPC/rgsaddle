[package]
name = "rgsaddle"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Band and minimum-mode saddle mechanics over rgmin steppers."
repository = "https://github.com/OmniPotentRPC/rgsaddle"
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
keywords = ["neb", "saddle", "transition-state", "optimization"]
categories = ["science"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
capi = []

[dependencies]
rgmin = "0.2"
eindir-core = { version = "0.6.0", features = ["capi"] }
ndarray = "0.17"
thiserror = "2"

[dev-dependencies]
approx = "0.5"

[package.metadata.capi.header]
name = "rgsaddle"
subdirectory = false

[package.metadata.capi.pkg_config]
name = "rgsaddle"
filename = "rgsaddle"

[package.metadata.capi.library]
name = "rgsaddle"
