[package]
name = "rgsaddle"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Band, minimum-mode, and index-1 Newton saddle mechanics."
repository = "https://github.com/OmniPotentRPC/rgsaddle"
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
keywords = ["neb", "saddle", "transition-state", "optimization"]
categories = ["science"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
capi = []
par = ["rgmin/par"]
highs = ["rgmin/highs"]
readcon = ["dep:readcon-core"]
# readcon-db 0.1.9 is the release that pins readcon-core = "=0.17.1".
# It is not on crates.io. A "0.1" requirement resolves to 0.1.8 and
# pulls readcon-core = "=0.16.1", and an optional crates.io pin is
# still resolved, so the dependency is omitted. The feature name stays
# so store_band can be enabled once that crate is a dependency. CI
# does not pass --features readcon-db.
readcon-db = ["readcon"]
chemfiles = ["readcon", "readcon-core/chemfiles"]

[dependencies]
dlpk = { version = "0.1.5", features = ["ndarray"] }
# readcon-core 0.17.1 is the version in revision 694e808 (git main).
# crates.io is still 0.17.0 and there is no v0.17.1 tag. This line
# returns to version = "=0.17.1" once that release exists.
# ConFrameWriter::new is RoundTrip and canonical stays off.
readcon-core = { git = "https://github.com/lode-org/readcon-core", rev = "694e808080c49979ee3099afcfa18e5420c40433", optional = true }
# The pinned revision supplies retained evaluations, manifold steps,
# and quick-min with its options. A git dependency cannot be published: an rgmin release
# that carries them must come out, and this line return to a version,
# before rgsaddle is released.
rgmin = { git = "https://github.com/OmniPotentRPC/rgmin", rev = "d76539dbe40695c0032e0d96a56e7932f2cc49ab" }
eindir-core = { version = "0.6.0", features = ["capi"] }
ndarray = "0.17"
rayon = "1.12"
thiserror = "2"
linkcell = { version = "0.3.3", git = "https://github.com/d-SEAMS/linkcell", rev = "f6cf5700ca9c90e1877c84b66fb68386de5ceffe", default-features = false }

[dev-dependencies]
approx = "0.5"
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
sha2 = "0.10"

[profile.dev.package.faer]
opt-level = 3

[profile.dev.package.pulp]
opt-level = 3

[profile.dev.package.gemm-f64]
opt-level = 3

[profile.dev.package.gemm-common]
opt-level = 3

# include/rgsaddle.h is the hand-written contract (surface request,
# status enum, stepping semantics); cargo-c installs it as is instead
# of a cbindgen rendering of src/capi.rs.
[package.metadata.capi.header]
name = "rgsaddle"
subdirectory = false
generation = false

[package.metadata.capi.install.include]
asset = [{ from = "include/rgsaddle.h", to = "" }, { from = "include/rgsaddle/session.hpp", to = "rgsaddle" }]

[package.metadata.capi.pkg_config]
name = "rgsaddle"
filename = "rgsaddle"

[package.metadata.capi.library]
name = "rgsaddle"
