[package]
name = "rgsaddle"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Band, minimum-mode, and index-1 Newton saddle mechanics."
repository = "https://github.com/OmniPotentRPC/rgsaddle"
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
keywords = ["neb", "saddle", "transition-state", "optimization"]
categories = ["science"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["faer"]
capi = []
par = ["rgmin/par"]
highs = ["rgmin/highs"]
ohtst = []
lammps = ["ohtst", "dep:capnp", "dep:libloading", "dep:rgpot-core"]
readcon = ["dep:readcon-core"]
# readcon-db 0.2 pins readcon-core = "=0.17.1", the same release as
# below, so the corpus and the CON writer share one readcon-core.
readcon-db = ["readcon", "dep:readcon-db"]
chemfiles = ["readcon", "readcon-core/chemfiles"]
# GMP and MPFR stay off the default build. `cargo test --features capi`
# does not compile this feature.
verify = ["dep:proptest", "dep:rug"]
# Reproduction harnesses which drive a canonical potential profile. Kept
# out of the default graph because the profile schema needs capnp at build
# time and the full PAFI cases need an external backend such as lammpc.
pafi-repro = ["dep:capnp", "dep:rgpot-core"]
# Dense self-adjoint spectra in connect, SQNM, and exact_eigh above
# dimension 128. On by default.
# The Kani prove step passes `--no-default-features` so this stays off:
# faer pulls pulp, and pulp's global assembly does not compile under Kani.
# The kani-github-action default command is a bare `cargo-kani`, which
# would turn this feature on. The verify workflow overrides that command
# and does not pass `--ignore-global-asm`.
faer = ["dep:faer"]

[dependencies]
dlpk = { version = "0.1.5", features = ["ndarray"] }
# ConFrameWriter::new is RoundTrip and canonical stays off.
readcon-core = { version = "=0.17.1", optional = true }
readcon-db = { version = "0.2", optional = true }
# Control::default leaves ftol_rel and noise_floor unset, the 0.5.1
# behaviour the sessions rely on.
# Crates.io 0.6.0 has no LevelSetConstraint, so the git pin supplies it.
rgmin = { version = "=0.6.0", git = "https://github.com/OmniPotentRPC/rgmin", rev = "f3d18706c2b1ab380fd75f62449fdab46d01f5e2" }
eindir-core = { version = "0.6.0", features = ["capi"] }
ndarray = "0.17"
faer = { version = "0.24.4", optional = true, default-features = false, features = ["std", "linalg"] }
rayon = "1.12"
thiserror = "2"
# The rev is tag v0.3.5. Its own minimage requirement is the caret
# ^0.1.2, so it builds against any 0.1.x from 0.1.2 up, and the range
# below is what keeps one minimage between this crate and linkcell.
linkcell = { version = "=0.3.5", git = "https://github.com/d-SEAMS/linkcell", rev = "49f94dd2d2ff1e0d854cebc8a664599abe569156", default-features = false }
# Cargo keeps one copy of a 0.1.x crate, so linkcell v0.3.5 and this crate
# share one Cell for as long as this range admits the version linkcell
# resolves to. 0.1.3 and later wrap an orthorhombic difference across
# every box image instead of one, and return the exact nearest image from
# displacement_euclidean on a triclinic cell. Cargo.lock holds 0.1.4.
minimage = ">=0.1.2, <0.2"
proptest = { version = "1.6", optional = true }
rug = { version = "1.27", optional = true }
# The reproduction harness constructs rgpot-core's generated schema, whose
# public Builder types use the Cap'n Proto 0.20 runtime.
capnp = { version = "0.20", optional = true }
libloading = { version = "0.8.9", optional = true }
rgpot-core = { version = "=3.7.0", git = "https://github.com/OmniPotentRPC/rgpot", rev = "97ebba0b062128b7dc4637501c4b70ed4944ae9d", features = ["profile"], optional = true }

[package.metadata.rgsaddle-lammps]
lammpc-git = "https://github.com/OmniPotentRPC/lammpc"
lammpc-rev = "dc443997"
rgpot-git = "https://github.com/OmniPotentRPC/rgpot"
rgpot-rev = "97ebba0b062128b7dc4637501c4b70ed4944ae9d"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
sha2 = "0.10"
# Tag v3.6.0. Zero dependencies of its own, so it adds no second copy of
# eindir-core, dlpk or rgmin. Rev 97ebba0b of rgpot-pair pins cc to
# =1.4.2, which cannot share cc 1.x with the other build dependencies.
rgpot-pair = { version = "=3.6.0", git = "https://github.com/OmniPotentRPC/rgpot", rev = "20c58fe5a2859cd0a79a3e06d64d567f96d0ccbe" }

[[bench]]
name = "ohtst"
harness = false
required-features = ["ohtst"]

[[example]]
name = "ohtst_skewed_well"
required-features = ["ohtst"]

[[example]]
name = "ohtst_tutorial"
required-features = ["ohtst"]

[[example]]
name = "ohtst_analytic"
required-features = ["ohtst"]

[[example]]
name = "howto_restart"
required-features = ["ohtst"]

[[example]]
name = "howto_parallel"
required-features = ["ohtst"]

[[example]]
name = "howto_convergence"
required-features = ["ohtst"]

[profile.dev.package.faer]
opt-level = 3

[profile.dev.package.pulp]
opt-level = 3

[profile.dev.package.gemm-f64]
opt-level = 3

[profile.dev.package.gemm-common]
opt-level = 3

# include/rgsaddle.h is the hand-written contract (surface request,
# status enum, stepping semantics); cargo-c installs it as is instead
# of a cbindgen rendering of src/capi.rs.
[package.metadata.capi.header]
name = "rgsaddle"
subdirectory = false
generation = false

[package.metadata.capi.install.include]
asset = [{ from = "include/rgsaddle.h", to = "" }, { from = "include/rgsaddle/session.hpp", to = "rgsaddle" }]

[package.metadata.capi.pkg_config]
name = "rgsaddle"
filename = "rgsaddle"

[package.metadata.capi.library]
name = "rgsaddle"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
