[package]
name = "rgsaddle"
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Band, minimum-mode, and index-1 Newton saddle mechanics."
repository = "https://github.com/OmniPotentRPC/rgsaddle"
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
keywords = ["neb", "saddle", "transition-state", "optimization"]
categories = ["science"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["faer"]
capi = []
par = ["rgmin/par"]
highs = ["rgmin/highs"]
readcon = ["dep:readcon-core"]
# The corpus and CON writer share one readcon-core release.
readcon-db = ["readcon", "dep:readcon-db"]
chemfiles = ["readcon", "readcon-core/chemfiles"]
# GMP and MPFR stay off the default build. `cargo test --features capi`
# does not compile this feature.
verify = ["dep:proptest", "dep:rug"]
# Dense self-adjoint spectra in connect, SQNM, and exact_eigh above
# dimension 128. On by default.
# The Kani prove step passes `--no-default-features` so this stays off:
# faer pulls pulp, and pulp's global assembly does not compile under Kani.
# The kani-github-action default command is a bare `cargo-kani`, which
# would turn this feature on. The verify workflow overrides that command
# and does not pass `--ignore-global-asm`.
faer = ["dep:faer"]

[dependencies]
dlpk = { version = "0.1.5", features = ["ndarray"] }
# ConFrameWriter::new is RoundTrip and canonical stays off.
readcon-core = { version = "=0.17.3", git = "https://github.com/lode-org/readcon-core", rev = "1465d5344f2dfa2dc64e60d063739e33f58c3745", optional = true }
readcon-db = { version = "0.2.0", git = "https://github.com/lode-org/readcon-db", rev = "4199499cc796056047361959eb8ec83cf2188932", optional = true }
# Share the finite-oracle solver revision with downstream hosts.
rgmin = { version = "0.5.2", git = "https://github.com/OmniPotentRPC/rgmin", rev = "fb3a852cace852dfc7f60be4b573cff28e96d68f" }
eindir-core = { version = "0.6.0", features = ["capi"] }
ndarray = "0.17"
faer = { version = "0.24.4", optional = true, default-features = false, features = ["std", "linalg"] }
rayon = "1.12"
thiserror = "2"
linkcell = { version = "0.3.11", git = "https://github.com/d-SEAMS/linkcell", rev = "74a513cc41c2730815bcd9110a96286f53ccf353", default-features = false }
proptest = { version = "1.6", optional = true }
rug = { version = "1.27", optional = true }

[dev-dependencies]
approx = "0.5"
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
sha2 = "0.10"

[profile.dev.package.faer]
opt-level = 3

[profile.dev.package.pulp]
opt-level = 3

[profile.dev.package.gemm-f64]
opt-level = 3

[profile.dev.package.gemm-common]
opt-level = 3

# include/rgsaddle.h is the hand-written contract (surface request,
# status enum, stepping semantics); cargo-c installs it as is instead
# of a cbindgen rendering of src/capi.rs.
[package.metadata.capi.header]
name = "rgsaddle"
subdirectory = false
generation = false

[package.metadata.capi.install.include]
asset = [{ from = "include/rgsaddle.h", to = "" }, { from = "include/rgsaddle/session.hpp", to = "rgsaddle" }]

[package.metadata.capi.pkg_config]
name = "rgsaddle"
filename = "rgsaddle"

[package.metadata.capi.library]
name = "rgsaddle"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
