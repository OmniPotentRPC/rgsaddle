[package]
name = "rgsaddle"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Band, minimum-mode, and index-1 Newton saddle mechanics."
repository = "https://github.com/OmniPotentRPC/rgsaddle"
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
keywords = ["neb", "saddle", "transition-state", "optimization"]
categories = ["science"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
capi = []

[dependencies]
rgmin = "0.3"
eindir-core = { version = "0.6.0", features = ["capi"] }
ndarray = "0.17"
thiserror = "2"

[dev-dependencies]
approx = "0.5"

# include/rgsaddle.h is the hand-written contract (surface request,
# status enum, stepping semantics); cargo-c installs it as is instead
# of a cbindgen rendering of src/capi.rs.
[package.metadata.capi.header]
name = "rgsaddle"
subdirectory = false
generation = false

[package.metadata.capi.install.include]
asset = [{ from = "include/rgsaddle.h", to = "" }]

[package.metadata.capi.pkg_config]
name = "rgsaddle"
filename = "rgsaddle"

[package.metadata.capi.library]
name = "rgsaddle"
