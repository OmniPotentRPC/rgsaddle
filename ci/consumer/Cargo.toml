# A dependent that takes rgsaddle from this checkout and pins the crates
# rgsaddle builds on by full rev. ci/check_dependency_pins.py fails when
# its graph holds a second copy of any of them, and the CI test job
# checks that lib.rs compiles.
[package]
name = "rgsaddle-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
pafi-repro = ["rgsaddle/pafi-repro"]
readcon-db = ["rgsaddle/readcon-db"]

[dependencies]
rgsaddle = { path = "../.." }
linkcell = { version = "=0.3.5", git = "https://github.com/d-SEAMS/linkcell", rev = "49f94dd2d2ff1e0d854cebc8a664599abe569156", default-features = false }
rgmin = { version = "0.8.0" }
# Match the potential interface that rgsaddle exposes with pafi-repro.
rgpot-core = { version = "=3.7.0", git = "https://github.com/OmniPotentRPC/rgpot", rev = "97ebba0b062128b7dc4637501c4b70ed4944ae9d" }
