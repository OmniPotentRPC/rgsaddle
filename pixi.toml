[workspace]
name = "rgsaddle"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tasks]
gen-gate = "nickel export --format yaml --field workflow ci/gate/plan.ncl -o .github/workflows/gate.yml && nickel export --format json --field plan ci/gate/plan.ncl -o ci/gate/plan.json"
gen-gha = { depends-on = ["gen-gate"] }
check-gate = "python ci/gate/check_gate.py"
# Four rustc jobs peaked near 19 GiB. Two jobs stay within a 16 GiB runner.
gate-cargo-build = "CMAKE_POLICY_VERSION_MINIMUM=3.5 CARGO_BUILD_JOBS=2 cargo build --locked --all-features"
gate-cargo-test = "CMAKE_POLICY_VERSION_MINIMUM=3.5 CARGO_BUILD_JOBS=2 cargo test --locked --all-features"
gate-clippy = "CMAKE_POLICY_VERSION_MINIMUM=3.5 CARGO_BUILD_JOBS=2 cargo clippy --locked --all-targets --all-features -- -D warnings"
gate-rustfmt = "cargo fmt --check"
gate-capi-build = "cargo build --locked --features capi --verbose"
gate-capi-test = "cargo test --locked --features capi --verbose"
gate-capi-subproject = "ci/meson_consumer.sh subproject target/debug/librgsaddle.so"
gate-capi-pkgconfig = "ci/meson_consumer.sh pkgconfig target/debug/librgsaddle.so"

[environments]
docs = { features = ["docs"] }
python = { features = ["python"] }

[feature.python]
platforms = ["linux-64", "linux-aarch64"]

[feature.python.dependencies]
python = ">=3.10,<3.14"
pytest = "*"
pytest-timeout = "*"
pytest-run-parallel = ">=0.4"
hypothesis = ">=6"
numpy = ">=1.24"
ase = "==3.29.0"
nanobind = "==3.1.0"
scikit-build-core = ">=1.1,<2"
rust = ">=1.88"

[feature.python.pypi-options]
no-build-isolation = ["rgsaddle"]

[feature.python.pypi-dependencies]
rgsaddle = { path = ".", editable = true, extras = ["test"] }

[feature.python.tasks]
python-build = "python -c 'import rgsaddle'"
python-test = { cmd = "pytest tests/python/ -q --timeout=120", depends-on = ["python-build"] }
gate-python-build = "python -c 'import rgsaddle'"
gate-python-test = "RGSADDLE_REQUIRE_ASE=1 python -m pytest tests/python -ra --timeout=180 -o faulthandler_timeout=120"
gate-selftest = "python -m pytest ci/gate -ra -p no:cacheprovider"

[feature.docs]
platforms = ["linux-64"]

[feature.docs.dependencies]
sphinx = ">=8.0,<8.1"
emacs = ">=30.2,<31"
pandoc = ">=3.1,<4"

[feature.docs.pypi-dependencies]
sphinx-sitemap = ">=2.9.0, <3"
shibuya = ">=2026.1.9, <2027"
myst-parser = ">=4.0, <5"
sphinxcontrib-bibtex = ">=2.6, <3"
sphinx-design = ">=0.6, <1"
sphinx-copybutton = ">=0.5.2, <1"
sphinxcontrib-rust = ">=1.0.0, <2"
sphinx-rustdoc-postprocess = ">=0.1.0, <0.2"

[feature.docs.tasks]
docs-export = "emacs --batch -l docs/export.el"
docs-build = { cmd = "sphinx-build -W --keep-going -b html docs/source docs/build/html", depends-on = ["docs-export"] }

[dependencies]
nickel = ">=9.9.9,<10"
rust = ">=1.100.0,<1.101"
python = ">=3.13.18,<3.16"
pip = ">=26.2.2,<27"
cmake = ">=4.5.0,<5"
ninja = ">=1.13.2,<2"
cxx-compiler = ">=2.0.0,<3"
m4 = ">=1.4.21,<2"
make = ">=4.4.1,<5"
actionlint = ">=1.7.12,<2"
meson = ">=1.12.1,<2"
pkg-config = ">=0.29.2,<0.30"
capnproto = ">=1.5.0,<2"
