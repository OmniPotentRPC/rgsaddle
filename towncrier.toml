# Copyright (c) rgsaddle developers

[tool.towncrier]
name = "rgsaddle"
directory = "docs/newsfragments"
filename = "docs/orgmode/changelog.org"
template = "docs/changelog.org.jinja"
start_string = "# towncrier release notes start\n"
title_format = "* {version} ({project_date})"
issue_format = "[[https://github.com/OmniPotentRPC/rgsaddle/issues/{issue}][#{issue}]]"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "dev"
name = "Developer"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true
